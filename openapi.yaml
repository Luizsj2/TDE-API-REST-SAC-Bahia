openapi: 3.0.0
info:
  title: API SAC Bahia
  version: 1.0.0
paths:
  /postos/{id_posto}/fila:
    get:
      summary: Retorna o tempo estimado de fila
      parameters:
        - name: id_posto
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  posto:
                    type: string
                  tempo_espera_minutos:
                    type: integer