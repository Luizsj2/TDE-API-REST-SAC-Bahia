openapi: 3.0.3
info:
  title: API SAC Bahia
  version: 2.0.0
  description: Protótipo acadêmico de filas, recomendação de posto e registro de chegada.
servers:
  - url: http://127.0.0.1:18080
security:
  - ApiKey: []
paths:
  /health:
    get:
      summary: Verifica se o processo HTTP responde
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Saude'
  /ready:
    get:
      summary: Verifica o acesso ao catálogo de postos
      responses:
        '200':
          $ref: '#/components/responses/Saude'
        '401':
          $ref: '#/components/responses/Erro'
        '503':
          $ref: '#/components/responses/Erro'
  /postos/{id_posto}/fila:
    get:
      summary: Consulta a espera estimada no posto
      parameters:
        - $ref: '#/components/parameters/IdPosto'
      responses:
        '200':
          description: Fila consultada
          content:
            application/json:
              schema:
                type: object
                required: [posto, tempo_espera_minutos]
                properties:
                  posto: { type: string }
                  tempo_espera_minutos: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'
        '503':
          $ref: '#/components/responses/Erro'
  /recomendacoes:
    post:
      summary: Ordena os postos pelo tempo estimado de viagem mais espera e retorna a rota do primeiro
      requestBody:
        $ref: '#/components/requestBodies/Origem'
      responses:
        '200':
          description: Postos ordenados e rota na malha acadêmica
          content:
            application/json:
              schema:
                type: object
                required: [recomendado, alternativas, rota]
                properties:
                  recomendado:
                    $ref: '#/components/schemas/Candidato'
                  alternativas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candidato'
                  rota:
                    type: object
                    required: [tipo, geometria]
                    properties:
                      tipo:
                        type: string
                        enum: [estimativa_grafo_demonstrativo]
                      geometria:
                        type: object
                        required: [type, coordinates]
                        properties:
                          type: { type: string, enum: [LineString] }
                          coordinates:
                            description: Posições GeoJSON em ordem longitude e latitude
                            type: array
                            minItems: 2
                            items:
                              type: array
                              minItems: 2
                              maxItems: 2
                              items: { type: number, format: double }
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '413':
          $ref: '#/components/responses/Erro'
        '422':
          $ref: '#/components/responses/Erro'
        '503':
          $ref: '#/components/responses/Erro'
  /postos/{id_posto}/chegadas:
    post:
      summary: Registra uma chegada de demonstração até 250 metros do posto
      parameters:
        - $ref: '#/components/parameters/IdPosto'
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_-]{8,64}$'
      requestBody:
        $ref: '#/components/requestBodies/Origem'
      responses:
        '200':
          $ref: '#/components/responses/Chegada'
        '201':
          $ref: '#/components/responses/Chegada'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'
        '413':
          $ref: '#/components/responses/Erro'
        '422':
          $ref: '#/components/responses/Erro'
        '503':
          $ref: '#/components/responses/Erro'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdPosto:
      in: path
      name: id_posto
      required: true
      schema: { type: string }
      example: feira
  requestBodies:
    Origem:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Coordenadas'
  responses:
    Erro:
      description: A operação não foi concluída
      content:
        application/json:
          schema:
            type: object
            required: [erro]
            properties:
              erro: { type: string }
    Saude:
      description: Serviço disponível
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [ok] }
    Chegada:
      description: Registro de chegada criado ou recuperado pela chave de idempotência
      content:
        application/json:
          schema:
            type: object
            required: [posto_id, protocolo, status, registrado_em]
            properties:
              posto_id: { type: string }
              protocolo: { type: string }
              status: { type: string, enum: [chegou] }
              registrado_em: { type: string, format: date-time }
  schemas:
    Coordenadas:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
      example: { latitude: -12.979, longitude: -38.452 }
    Candidato:
      allOf:
        - $ref: '#/components/schemas/Coordenadas'
        - type: object
          required: [id, posto, tempo_espera_minutos, viagem_minutos, total_minutos, distancia_km]
          properties:
            id: { type: string }
            posto: { type: string }
            tempo_espera_minutos: { type: integer, minimum: 0 }
            viagem_minutos: { type: integer, minimum: 0 }
            total_minutos: { type: integer, minimum: 0 }
            distancia_km: { type: number, minimum: 0 }
